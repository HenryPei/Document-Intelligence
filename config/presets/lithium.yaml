date_patterns:
  - '\|\s*\d{1,2}\s+\w+\s+\d{4}\s*\|'
  - '\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{4}'
  - '\d{4}-\d{2}-\d{2}'
  - '(?:SFY|H[12]/)?FY\d{2}'

noise_patterns:
  - '^(ylno|esu|lanosrep|roF)$'
  - '^For personal use only$'
  - '^ABN\s+\d+'
  - '^Rules?\s+\d+'
  - '^\d+\s+Page\s+\d+'
  - '^Appendix\s+\d'